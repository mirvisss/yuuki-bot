name: Keep-alive

# Render выключает бесплатный веб-сервис после 15 минут без входящих запросов.
# Этот workflow стучится в healthcheck бота, чтобы сервис не спал: раз в 5 минут
# (минимальный шаг расписания GitHub) остаётся большой запас до 15-минутного порога.
# Если бот всё же уснул, первый запрос разбудит его (запуск занимает до 50 секунд),
# поэтому curl даёт до 90 секунд и повторяет попытку.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Yuuki
        run: |
          url="https://yuuki-bot-iu6b.onrender.com/"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url" || true)
            echo "attempt $attempt -> ${code:-no-response}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "healthcheck did not answer with 200 within 3 attempts"
